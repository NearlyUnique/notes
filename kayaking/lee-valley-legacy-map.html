<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Lee Valley Legacy Map</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
  }
  #map {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: contain;
  }
  #toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
  }
  ul {
    position: fixed;
    top: 3.5rem;
    right: 1rem;
    margin: 0;
    padding: 0.5rem 1rem;
    list-style: none;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 0.25rem;
  }
</style>
</head>
<body>
<button id="toggle">Mode: Auto</button>
<ul><li><a href="./10-challenges">10 Challenges</a></li></ul>
<img id="map" src="lee-valley-legacy-landscape-map.svg" alt="Lee Valley Legacy map">

<script>
  const map = document.getElementById('map');
  const toggle = document.getElementById('toggle');
  const sources = {
    landscape: 'lee-valley-legacy-landscape-map.svg',
    portrait: 'lee-valley-legacy-portrait-map.svg'
  };
  const modes = ['auto', 'portrait', 'landscape'];
  const portraitQuery = window.matchMedia('(orientation: portrait)');
  let mode = 'auto';

  function pickOrientation() {
    return portraitQuery.matches ? 'portrait' : 'landscape';
  }

  function render() {
    map.src = sources[mode === 'auto' ? pickOrientation() : mode];
    toggle.textContent = 'Mode: ' + mode.charAt(0).toUpperCase() + mode.slice(1);
  }

  toggle.addEventListener('click', () => {
    mode = modes[(modes.indexOf(mode) + 1) % modes.length];
    render();
  });

  portraitQuery.addEventListener('change', render);

  render();
</script>
</body>
</html>
